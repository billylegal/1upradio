<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Magic Ears</title><meta name="robots" content="noindex"><link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="icon-192.png"><link rel="apple-touch-icon" href="icon-192.png"><meta name="theme-color" content="#0b0b1a">
<style>
:root{--bg:#0b0b1a;--c:#7a4dff;--c2:#00e5ff;--txt:#eef;--dim:#8b8bb0}
*{box-sizing:border-box}html,body{margin:0;background:var(--bg);color:var(--txt);font:16px/1.4 system-ui,-apple-system,Segoe UI,sans-serif;min-height:100%}
body{padding:calc(18px + env(safe-area-inset-top)) 18px calc(30px + env(safe-area-inset-bottom));max-width:560px;margin:0 auto;display:flex;flex-direction:column;align-items:center}
h1{font-size:22px;margin:6px 0 2px;letter-spacing:1px}p.sub{margin:0 0 18px;color:var(--dim);font-size:14px;text-align:center}
#btn{position:relative;width:220px;height:220px;border-radius:50%;border:0;background:radial-gradient(circle at 35% 30%,var(--c2),var(--c) 60%,#2a1a7a);color:#fff;font:700 20px system-ui;box-shadow:0 0 0 0 rgba(122,77,255,.6),0 18px 50px rgba(0,0,0,.5);cursor:pointer;-webkit-tap-highlight-color:transparent}
#btn.rec{animation:pulse 1.2s infinite}#btn:disabled{opacity:.7}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(0,229,255,.7),0 18px 50px rgba(0,0,0,.5)}100%{box-shadow:0 0 0 46px rgba(0,229,255,0),0 18px 50px rgba(0,0,0,.5)}}
#t{margin:14px 0 4px;min-height:22px;color:var(--dim)}
.card{width:100%;background:#15152b;border:1px solid #2a2a55;border-radius:16px;padding:14px 16px;margin-top:12px}
.card h2{margin:0 0 6px;font-size:13px;letter-spacing:1.5px;color:var(--c2);text-transform:uppercase}
.big{font-size:20px;font-weight:700}.tag{display:inline-block;padding:2px 10px;border-radius:99px;background:#26264f;font-size:12px;margin-left:6px}
.l{padding:3px 0;border-top:1px solid #20203f}.l:first-of-type{border-top:0}.l i{color:var(--dim);font-style:normal;font-size:12px;margin-right:8px}
small{color:var(--dim)}
</style></head><body>
<h1>MAGIC EARS</h1><p class="sub">Play some music near your phone, tap, and listen: it names the song and writes out the vocals.</p>
<button id="btn" type="button">TAP TO LISTEN</button><div id="t"></div><div id="out" style="width:100%"></div>
<p class="sub" style="margin-top:22px"><small>Works on your home Wi-Fi while your PC is on. First time: <a id="conn" href="#" style="color:#00e5ff">connect to my PC</a> (accept the certificate warning once), then come back.</small></p>
<p class="sub"><small>To install: tap the browser menu, then <b>Install app</b>.</small></p>
<script>
var BASE=(function(){try{return localStorage.getItem('ears-pc')||'https://192.168.1.165:8443'}catch(e){return 'https://192.168.1.165:8443'}})();
var btn=document.getElementById('btn'),t=document.getElementById('t'),out=document.getElementById('out'),SECS=14;
function esc(s){return String(s).replace(/[&<>]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;'}[c]})}
function show(r){var h='';
 if(r.error){out.innerHTML='<div class="card"><h2>Hmm</h2>'+esc(r.error)+'</div>';return}
 h+='<div class="card"><h2>Song</h2>'+(r.match?'<span class="big">'+esc(r.match.name)+'</span> <span class="tag">'+r.match.votes+' matches</span>':'<span class="big">Not in my library</span><br><small>I only know the songs I was taught. The words below can still help.</small>')+'</div>';
 var v=r.vocals||{};h+='<div class="card"><h2>Vocals <span class="tag">'+esc(v.verdict||'')+'</span></h2>';
 if(v.lines&&v.lines.length){v.lines.forEach(function(l){h+='<div class="l"><i>'+Math.floor(l.t/60)+':'+('0'+Math.floor(l.t%60)).slice(-2)+'</i>'+esc(l.l)+'</div>'})}else h+='<small>No words picked up.</small>';h+='</div>';
 if(r.lyric_matches&&r.lyric_matches.length){h+='<div class="card"><h2>Sounds like</h2>';r.lyric_matches.forEach(function(m){h+='<div class="l">'+esc(m.title)+'</div>'});h+='</div>'}
 out.innerHTML=h}
btn.onclick=async function(){
 out.innerHTML='';
 var st;try{st=await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:false,noiseSuppression:false,autoGainControl:false}})}catch(e){t.textContent='Microphone blocked. Allow it in the browser settings.';return}
 var mt=MediaRecorder.isTypeSupported('audio/webm;codecs=opus')?'audio/webm;codecs=opus':(MediaRecorder.isTypeSupported('audio/mp4')?'audio/mp4':''),rec=new MediaRecorder(st,mt?{mimeType:mt}:{}),ch=[];
 rec.ondataavailable=function(e){if(e.data.size)ch.push(e.data)};
 btn.disabled=true;btn.classList.add('rec');var left=SECS;t.textContent='Listening... '+left;var iv=setInterval(function(){left--;t.textContent=left>0?'Listening... '+left:''},1000);
 rec.onstop=async function(){clearInterval(iv);st.getTracks().forEach(function(x){x.stop()});btn.classList.remove('rec');t.textContent='Thinking... (the first one takes a bit longer)';
  var blob=new Blob(ch,{type:rec.mimeType||'audio/webm'});
  try{var r=await fetch(BASE+'/match',{method:'POST',headers:{'Content-Type':blob.type},body:blob});var m=await r.json();m.vocals={verdict:'listening...',lines:[]};show(m);btn.disabled=false;t.textContent='Listening to the vocals...';
   var r2=await fetch(BASE+'/vocals',{method:'POST',headers:{'Content-Type':blob.type},body:blob});show(await r2.json());t.textContent=''}catch(e){t.textContent='Could not reach the PC. Same Wi-Fi? Is it on?';btn.disabled=false}};
 rec.start();setTimeout(function(){rec.stop()},SECS*1000)};
document.getElementById('conn').onclick=function(e){e.preventDefault();var a=prompt('Address of your PC (leave as is at home):',BASE);if(a){BASE=a.replace(/\/$/,'');try{localStorage.setItem('ears-pc',BASE)}catch(x){}}window.open(BASE+'/','_blank')};
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(function(){});
</script></body></html>
